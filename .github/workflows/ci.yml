# Verifica os três projetos a cada push na main e em cada Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a verificação anterior, que ficou desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App do aluno (lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # o lint da raiz cobre também admin/ e backend/
      - run: npm test
      - run: npm run build # inclui a checagem de tipos (tsc -b)

  admin:
    name: Painel admin (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build # inclui a checagem de tipos (tsc --noEmit)

  api:
    name: API (tipos e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres só para os testes: o banco caronacampus_test é criado pelos próprios testes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carona
          POSTGRES_PASSWORD: carona
          POSTGRES_DB: caronacampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
