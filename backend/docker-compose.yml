services:
  db:
    image: postgres:16
    container_name: carona-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carona
      POSTGRES_PASSWORD: carona
      POSTGRES_DB: caronacampus
    ports:
      - "5432:5432"
    volumes:
      # As tabelas são criadas pelas migrações (npm run migrar), não pelo Docker.
      - carona_pgdata:/var/lib/postgresql/data

volumes:
  carona_pgdata:
