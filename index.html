<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cor da barra do navegador/PWA = fundo do tema (canvas). As duas valem para o modo "dispositivo"
         antes do app carregar; depois, src/lib/tema.ts copia o token --color-canvas para ambas. -->
    <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)" />
    <!-- Aplica o tema salvo antes da primeira pintura, para não piscar no claro (mesma regra de src/lib/tema.ts). -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("tema"); } catch (e) {}
        var escuro = p === "escuro" || (p !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.setAttribute("data-tema", "escuro");
        if (p === "claro" || p === "escuro") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var cor = metas[escuro ? 1 : 0].getAttribute("content");
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", cor);
        }
      })();
    </script>
    <meta name="description" content="Caronas entre alunos da Facens: encontre quem faz o mesmo trajeto e divida o combustível." />
    <title>CaronaCampus</title>

    <!-- PWA: instalável na tela inicial e abre em tela cheia (sem a barra do navegador). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <!-- iPhone: o Safari usa estas tags em vez do manifesto para o ícone e o modo tela cheia. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CaronaCampus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
